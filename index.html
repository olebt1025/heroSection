<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="./assets/images/startup.png" type="image/x-icon">
    <title>SolShuttle</title>
</head>
<body>
    <video autoplay muted loop id="backgroundVideo-earth" src="./assets/animation/Viewing the Earth’s Rotation from Space.mp4"></video>
    <section id="hero-section">
        <div>
            <h3>50% on G-suits!!!</h3>
            <p id="hero-p">Tired of passing out<br> during high G maneuvers?<br>
            Buy our patented G-suit.<br> (comes in many colors).
            </p>
            <button id="hero-btn">ORDER NOW!!!</button>
        </div>
        <div id="suit-btn">
            <img src="./assets/images/G-suit.png" alt="">
        </div>
    </section>
    <header>
        <h1>SolShuttle</h1>
        <nav>
            <ul>
                <li><a href="#earth">Earth</a></li>
                <li><a href="#mars">Mars</a></li>
                <li><a href="#jovian">Jovian System</a></li>
                <li>Plan Trip</li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="earth">
            <h3 id="earth-hover">Earth</h3>
            <select name="" id="earthSystem">
                <option value="">Earth</option>
                <option value="luna">Luna</option>
            </select>
            <button>Schedule</button>
        </section>
        <section id="mars">
            <h3 id="mars-hover">Mars</h3>
            <button>Schedule</button>
        </section>
        <section id="jovian">
            <h3 id="jovian-hover">Jovian System</h3>
            <select name="Moons" id="">
                <option value="">Callisto</option>
                <option value="">Europa</option>
                <option value="">Ganymede</option>
                <option value="">Io</option>
            </select>
            <button>Schedule</button>
        </section>
    </main>
    <footer>
        <a href="">back to top</a>
    </footer>
</body>
</html>
